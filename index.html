<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Peppo Casino</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff0000">

<style>
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle,#1a0000,#000);
  color:white;
  text-align:center;
}

.screen{display:none;}

button{
  padding:10px;
  margin:5px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
}

.topbar{
  position:sticky;
  top:0;
  background:#111;
  padding:10px;
}
</style>
</head>

<body>

<div id="auth">
  <h1>🎰 PE P P O CASINO</h1>
  <input id="nick" placeholder="nick"><br>
  <button onclick="login()">LOGIN</button>
</div>

<!-- TOP HOME BAR (sempre visibile quando loggato) -->
<div id="topbar" style="display:none;" class="topbar">
  <button onclick="show('home')">🏠 HOME</button>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <h2>HOME</h2>
  <button onclick="show('slot')">🎰 Slot</button>
  <button onclick="show('shop')">🏪 Shop</button>
  <button onclick="show('bp')">🎫 Battle Pass</button>
  <button onclick="show('ms')">📅 Missioni</button>
  <button onclick="show('lb')">🏆 Classifica</button>
</div>

<!-- SLOT -->
<div id="slot" class="screen">
  <h2>🎰 SLOT</h2>
  <button onclick="spin()">SPIN</button>
</div>

<!-- SHOP -->
<div id="shop" class="screen">
  <h2>🏪 SHOP</h2>
  <button onclick="buy('luck')">Luck</button>
</div>

<!-- BATTLE PASS -->
<div id="bp" class="screen">
  <h2>🎫 BATTLE PASS</h2>
  <div id="bpUI"></div>
</div>

<!-- MISSIONI -->
<div id="ms" class="screen">
  <h2>📅 MISSIONI</h2>
  <div id="msUI"></div>
</div>

<!-- LEADERBOARD -->
<div id="lb" class="screen">
  <h2>🏆 CLASSIFICA</h2>
  <div id="lbUI"></div>
</div>

<script>

let users = JSON.parse(localStorage.getItem("u")||"{}");
let cur=null;

const symbols=["🍒","🍋","💎","7️⃣","⭐"];

/* LOGIN */
function login(){
  let n=nick.value;

  if(!users[n]){
    users[n]={
      credits:1000,
      level:1,
      xp:0,
      battlepass:{level:1,xp:0},
      missions:{spins:0,wins:0}
    };
  }

  cur=n;

  auth.style.display="none";
  topbar.style.display="block";

  show("home");
}

/* NAV */
function show(s){

  document.querySelectorAll(".screen").forEach(x=>x.style.display="none");

  if(s==="home")home.style.display="block";
  if(s==="slot")slot.style.display="block";
  if(s==="shop")shop.style.display="block";
  if(s==="bp")bp.style.display="block";
  if(s==="ms")ms.style.display="block";
  if(s==="lb")lb.style.display="block";

  update();
}

/* SLOT */
function spin(){

  let u=users[cur];

  let r=[
    symbols[Math.floor(Math.random()*symbols.length)],
    symbols[Math.floor(Math.random()*symbols.length)],
    symbols[Math.floor(Math.random()*symbols.length)]
  ];

  let win=0;

  if(r[0]===r[1]&&r[1]===r[2]){
    win=500;
    u.missions.wins++;
  }

  u.credits+=win;
  u.missions.spins++;

  u.xp+=10;

  let bp=u.battlepass;
  bp.xp+=win?20:5;

  if(bp.xp>=100){
    bp.level++;
    bp.xp=0;
  }

  if(u.xp>=100){
    u.level++;
    u.xp=0;
  }

  save();
  update();
}

/* SHOP */
function buy(t){
  let u=users[cur];
  if(t==="luck"&&u.credits>=500)u.credits-=500;
  save();update();
}

/* UI */
function updateBP(){
  bpUI.innerHTML=`BP Lv ${users[cur].battlepass.level}`;
}

function updateMS(){
  msUI.innerHTML=`Spins ${users[cur].missions.spins}<br>Wins ${users[cur].missions.wins}`;
}

function updateLB(){
  let arr=Object.entries(users)
  .sort((a,b)=>b[1].credits-a[1].credits)
  .slice(0,10);

  lbUI.innerHTML=arr.map((x,i)=>`#${i+1} ${x[0]} ${x[1].credits}`).join("<br>");
}

function update(){
  if(!cur)return;
  updateBP();
  updateMS();
  updateLB();
}

function save(){
  localStorage.setItem("u",JSON.stringify(users));
}

</script>

</body>
</html>
