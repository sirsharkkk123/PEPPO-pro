<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Peppo Casino</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff0000">

<style>
body{
  margin:0;
  font-family:Arial;
  background:radial-gradient(circle,#1a0000,#000);
  color:white;
  text-align:center;
}

.screen{display:none;}
button{
  padding:10px;
  margin:5px;
  background:red;
  color:white;
  border:none;
  border-radius:8px;
}

#slot3d{display:flex;justify-content:center;gap:10px;margin:20px;}
.reel{width:80px;height:80px;background:#111;font-size:40px;display:flex;align-items:center;justify-content:center;}
</style>
</head>

<body>

<div id="auth">
  <h1>🎰 PE P P O CASINO</h1>
  <input id="nick" placeholder="nick"><br>
  <input id="pass" type="password" placeholder="pass"><br>
  <button onclick="login()">LOGIN</button>
</div>

<div id="menu" class="screen">
  <h2>MENU</h2>
  <button onclick="show('slot')">🎰 Slot</button>
  <button onclick="show('shop')">🏪 Shop</button>
  <button onclick="show('bp')">🎫 Battle Pass</button>
  <button onclick="show('ms')">📅 Missioni</button>
  <button onclick="show('lb')">🏆 Classifica</button>
</div>

<div id="slot" class="screen">
  <div id="slot3d">
    <div class="reel" id="r1">❓</div>
    <div class="reel" id="r2">❓</div>
    <div class="reel" id="r3">❓</div>
  </div>
  <button onclick="spin()">SPIN 🎰</button>
</div>

<div id="shop" class="screen">
  <h2>🏪 SHOP</h2>
  <button onclick="buy('luck')">🍀 Luck</button>
  <button onclick="buy('bonus')">💰 Bonus</button>
</div>

<div id="bp" class="screen">
  <h2>🎫 Battle Pass</h2>
  <div id="bpUI"></div>
</div>

<div id="ms" class="screen">
  <h2>📅 Missioni</h2>
  <div id="msUI"></div>
</div>

<div id="lb" class="screen">
  <h2>🏆 Leaderboard</h2>
  <div id="lbUI"></div>
</div>

<script>

let users = JSON.parse(localStorage.getItem("u")||"{}");
let cur=null;

const symbols=["🍒","🍋","💎","7️⃣","⭐"];

/* LOGIN */
function login(){
  let n=nick.value;

  if(!users[n]){
    users[n]={
      credits:1000,
      level:1,
      xp:0,
      battlepass:{level:1,xp:0},
      missions:{spins:0,wins:0}
    };
  }

  cur=n;
  auth.style.display="none";
  menu.style.display="block";

  show("menu");
}

/* NAV */
function show(s){
  document.querySelectorAll(".screen").forEach(x=>x.style.display="none");

  if(s==="menu")menu.style.display="block";
  if(s==="slot")slot.style.display="block";
  if(s==="shop")shop.style.display="block";
  if(s==="bp")bp.style.display="block";
  if(s==="ms")ms.style.display="block";
  if(s==="lb")lb.style.display="block";

  update();
}

/* SLOT */
function spin(){

  let u=users[cur];

  let r=[
    symbols[Math.floor(Math.random()*symbols.length)],
    symbols[Math.floor(Math.random()*symbols.length)],
    symbols[Math.floor(Math.random()*symbols.length)]
  ];

  r1.innerText=r[0];
  r2.innerText=r[1];
  r3.innerText=r[2];

  let win=0;

  if(r[0]===r[1]&&r[1]===r[2]){
    win=500;
    u.missions.wins++;
  }

  u.credits+=win;
  u.missions.spins++;

  u.xp+=10;

  let bp=u.battlepass;
  bp.xp+=win?20:5;

  if(bp.xp>=100){
    bp.xp=0;
    bp.level++;
  }

  if(u.xp>=100){
    u.level++;
    u.xp=0;
  }

  save();
  update();
}

/* SHOP */
function buy(t){
  let u=users[cur];

  if(t==="luck"&&u.credits>=500){
    u.credits-=500;
  }

  if(t==="bonus"&&u.credits>=1000){
    u.credits-=1000;
  }

  save();update();
}

/* UI BP */
function updateBP(){
  let b=users[cur].battlepass;
  bpUI.innerHTML=`Lv:${b.level} XP:${b.xp}/100`;
}

/* MISSIONS */
function updateMS(){
  let m=users[cur].missions;
  msUI.innerHTML=`Spins:${m.spins}<br>Wins:${m.wins}`;
}

/* LB */
function updateLB(){
  let arr=Object.entries(users)
  .sort((a,b)=>b[1].credits-a[1].credits)
  .slice(0,10);

  lbUI.innerHTML=arr.map((x,i)=>`#${i+1} ${x[0]} - ${x[1].credits}`).join("<br>");
}

/* UPDATE */
function update(){
  if(!cur)return;
  updateBP();
  updateMS();
  updateLB();
}

function save(){
  localStorage.setItem("u",JSON.stringify(users));
}

/* PWA AUTO SW */
if("serviceWorker" in navigator){
  const sw = `
    self.addEventListener('fetch',e=>{
      e.respondWith(fetch(e.request));
    });
  `;
  const blob = new Blob([sw], {type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}

</script>

</body>
</html>
